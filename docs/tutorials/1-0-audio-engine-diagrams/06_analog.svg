<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1240" version="1.1" viewBox="0 0 2000 1240" width="2000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="5" markerWidth="5" orient="auto" refX="12" refY="7" viewBox="0 0 14 14"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#edf5ff" /></marker></defs><rect fill="#08111c" height="1240" width="2000" x="0" y="0" /><rect fill="#85b5ff" height="11" width="2000" x="0" y="0" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="78">CARAVEL  /  FM-1</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="151">ANALOG engine | subtractive synthesis</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="65" y="199">Two band-limited oscillators plus noise, drive and a selectable multimode filter.</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="227" y2="227" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="69" y="280">TWO OSCILLATORS → NOISE / DRIVE → FILTER</text><rect fill="#15263a" height="145" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="330" x="78" y="353" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="102" y="402">OSC 1</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="102" y="440.0">SAW · SQR · TRI</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="102" y="468.4">SIN · PWM</text><rect fill="#15263a" height="145" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="330" x="78" y="557" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="102" y="606">OSC 2</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="102" y="644.0">detuned by DTN</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="102" y="672.4">SYNC or SUB modes</text><rect fill="#15263a" height="160" rx="18" ry="18" stroke="#57d7f1" stroke-width="2.4" width="315" x="472" y="439" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="496" y="488">OSC MIX</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="496" y="526.0">MIX + NOIS</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="496" y="554.4">optional wave MORPH</text><polyline fill="none" marker-end="url(#arrow)" points="408,425 451,425 451,506 458,506" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arrow)" points="408,629 451,629 451,532 458,532" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="160" rx="18" ry="18" stroke="#fa8e80" stroke-width="2.4" width="290" x="840" y="439" /><text fill="#fa8e80" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="864" y="488">DRIVE</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="864" y="526.0">optional pre-filter</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="864" y="554.4">soft saturation</text><polyline fill="none" marker-end="url(#arrow)" points="787,515 827,515" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="160" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="390" x="1183" y="439" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1207" y="488">FILTER</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1207" y="526.0">state-variable LP / BP / HP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1207" y="554.4">CUT + RES + KTR</text><polyline fill="none" marker-end="url(#arrow)" points="1130,515 1168,515" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="160" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="295" x="1625" y="439" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1649" y="488">VOICE AMP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1649" y="526.0">host ADSR</text><polyline fill="none" marker-end="url(#arrow)" points="1573,515 1610,515" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#0c1928" height="248" rx="20" ry="20" stroke="#85b5ff" stroke-width="2" width="885" x="72" y="752" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="96" y="795">SPECIAL OSCILLATOR MODES</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="831.0">SYNC: OSC 2 saw is hard-synced to OSC 1.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="860.7">SUB: OSC 2 becomes a square one octave down.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="890.4">PWM and waveform morph add evolving timbres.</text><rect fill="#0c1928" height="248" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="931" x="985" y="752" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1009" y="795">NOT THE TRACK FILTER</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1009" y="831.0">ANALOG has its own engine filter INSIDE synthesis.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1009" y="860.7">A separate track FILTER still operates after INSERT</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1009" y="890.4">and SLICER, before LEVEL and the global sends.</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="70" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="140.0" y="1110">WAVE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="198" x="225" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="324.0" y="1110">DTN / SYNC</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="183" x="438" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="529.5" y="1110">MIX / SUB</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="636" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="706.0" y="1110">NOIS</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="791" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="861.0" y="1110">CUT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="946" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1016.0" y="1110">RES</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="1101" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1171.0" y="1110">DRV</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#85b5ff" stroke-width="1.7" width="140" x="1256" y="1075" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1326.0" y="1110">KTR</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Source: firmware/src/eng_analog.c  ·  conceptual reference: classic two-oscillator subtractive synthesizers</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
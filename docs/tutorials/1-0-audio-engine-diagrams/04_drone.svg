<svg baseProfile="full" height="1240" version="1.1" viewBox="0 0 2000 1240" width="2000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="5" markerWidth="5" orient="auto" refX="12" refY="7" viewBox="0 0 14 14"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#edf5ff" /></marker></defs><rect fill="#08111c" height="1240" width="2000" x="0" y="0" /><rect fill="#ba9aff" height="11" width="2000" x="0" y="0" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="78">CARAVEL  /  FM-1</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="151">DRONE engine | a four-generator network</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="65" y="199">Conceptual inspiration: SOMA LYRA-8. It is NOT a LYRA clone or a self-sustaining hardware voice.</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="227" y2="227" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="69" y="280">ONE HOST VOICE CONTROLS FOUR INTERNAL GENERATORS</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#ba9aff" stroke-width="2.4" width="204" x="80" y="343" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="104" y="392">GEN 1</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="430.0">sine / CHAR</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#ba9aff" stroke-width="2.4" width="204" x="315" y="343" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="339" y="392">GEN 2</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="339" y="430.0">sine / CHAR</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#ba9aff" stroke-width="2.4" width="204" x="550" y="343" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="574" y="392">GEN 3</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="574" y="430.0">sine / CHAR</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#ba9aff" stroke-width="2.4" width="204" x="785" y="343" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="809" y="392">GEN 4</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="809" y="430.0">sine / CHAR</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="400" x="1080" y="343" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1104" y="392">PM COUPLING</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1104" y="430.0">previous-sample routing</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1104" y="458.4">COUPLE + TOPO</text><polyline fill="none" points="182,471 182,506 1020,506 1020,408 1068,408" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" /><polyline fill="none" points="417,471 417,506 1020,506 1020,408 1068,408" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" /><polyline fill="none" points="652,471 652,506 1020,506 1020,408 1068,408" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" /><polyline fill="none" points="887,471 887,506 1020,506 1020,408 1068,408" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.1" /><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="390" x="1530" y="343" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1554" y="392">4-GEN SUM</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1554" y="430.0">DC reject → TONE LP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1554" y="458.4">host AMP</text><polyline fill="none" marker-end="url(#arrow)" points="1480,408 1518,408" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#0c1928" height="270" rx="20" ry="20" stroke="#ba9aff" stroke-width="2" width="865" x="70" y="558" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="94" y="601">TOPO 0–2  ·  LEGACY NETWORK</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="637.0">PAIRS: 1↔2 and 3↔4</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="666.7">CHAIN: each generator hears the previous one</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="696.4">RING: the network closes into a loop</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="726.1">4 generators stay in a single host voice.</text><rect fill="#0c1928" height="270" rx="20" ry="20" stroke="#4fe0c2" stroke-width="2" width="955" x="963" y="558" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="987" y="601">TOPO 3–5  ·  CELL MODES</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="987" y="637.0">CELLPAIR / CELLCHN / CELLRING</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="987" y="666.7">Individual note gestures can own network cells.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="987" y="696.4">Cell activity, interval roughness and BREATH</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="987" y="726.1">change the coupling and amplitude response.</text><rect fill="#0c1928" height="169" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="1848" x="70" y="868" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="94" y="911">HOW THE CONTROL GRAPH WORKS</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="947.0">TOPO changes who modulates whom; it is not a chain of separate effects.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="94" y="976.7">SPREAD and DETUNE set tuning · CHAR changes generator character · DRIFT/RATE add slow motion.</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="70" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="140.0" y="1109">SPREAD</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="225" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="295.0" y="1109">DETUNE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="380" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="450.0" y="1109">COUPLE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="535" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="605.0" y="1109">TOPO</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="690" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="760.0" y="1109">CHAR</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="845" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="915.0" y="1109">DRIFT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="1000" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1070.0" y="1109">RATE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#ba9aff" stroke-width="1.7" width="140" x="1155" y="1074" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1225.0" y="1109">TONE</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Source: firmware/src/eng_drone.c  ·  four generators, one host voice  ·  reference: SOMA LYRA-8 (concept only)</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
<svg baseProfile="full" height="1240" version="1.1" viewBox="0 0 2000 1240" width="2000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="5" markerWidth="5" orient="auto" refX="12" refY="7" viewBox="0 0 14 14"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#edf5ff" /></marker></defs><rect fill="#08111c" height="1240" width="2000" x="0" y="0" /><rect fill="#fa8e80" height="11" width="2000" x="0" y="0" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="78">CARAVEL  /  FM-1</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="151">HADES engine | subs, filter, bass shelf and drive</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="65" y="199">Inspired by Dreadbox Hades RE; original Caravel DSP, not a measured hardware clone.</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="227" y2="227" /><text fill="#fa8e80" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="69" y="280">THE EXACT POST-FILTER ORDER</text><rect fill="#15263a" height="145" rx="18" ry="18" stroke="#fa8e80" stroke-width="2.4" width="335" x="72" y="320" /><text fill="#fa8e80" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="96" y="369">MAIN OSC</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="407.0">OFF · SAW · PULSE</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="435.4">PW sets pulse width</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="335" x="72" y="500" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="96" y="549">SUB 1</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="587.0">one octave below</text><rect fill="#15263a" height="128" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="335" x="72" y="661" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="96" y="710">SUB 2</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="748.0">two octaves below</text><rect fill="#15263a" height="190" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="243" x="487" y="450" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="511" y="499">OSC MIX</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="511" y="537.0">independent</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="511" y="565.4">SUB1 / SUB2</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="511" y="593.8">levels</text><polyline fill="none" marker-end="url(#arrow)" points="407,394 449,394 449,544 475,544" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" marker-end="url(#arrow)" points="407,565 449,565 449,544 475,544" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><polyline fill="none" marker-end="url(#arrow)" points="407,725 449,725 449,544 475,544" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" /><rect fill="#15263a" height="155" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="310" x="790" y="464" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="814" y="513">3-POLE LP FILTER</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="814" y="551.0">CUT + RES</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="814" y="579.4">resonant low-pass</text><polyline fill="none" marker-end="url(#arrow)" points="730,546 779,546" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="155" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="310" x="1160" y="464" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1184" y="513">BODY SHELF</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1184" y="551.0">low-band boost</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1184" y="579.4">around 120 Hz</text><polyline fill="none" marker-end="url(#arrow)" points="1100,546 1149,546" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="155" rx="18" ry="18" stroke="#fa8e80" stroke-width="2.4" width="365" x="1532" y="464" /><text fill="#fa8e80" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1556" y="513">DRV → AMP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1556" y="551.0">post-shelf saturation</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1556" y="579.4">host ADSR / velocity</text><polyline fill="none" marker-end="url(#arrow)" points="1470,546 1521,546" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#0c1928" height="196" rx="20" ry="20" stroke="#fa8e80" stroke-width="2" width="865" x="80" y="846" /><text fill="#fa8e80" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="104" y="889">AUDIBLE RESULT</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="925.0">Sub-octaves add weight, even with WAVE = OFF.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="954.7">The filter shapes the combined oscillator signal.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="984.4">BODY reinforces low frequencies AFTER the filter.</text><rect fill="#0c1928" height="196" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="927" x="980" y="846" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1004" y="889">CORRECTION TO THE EARLIER DIAGRAM</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1004" y="925.0">BODY is not before the filter.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1004" y="954.7">The actual order is FILTER → BODY → DRV.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1004" y="984.4">Main oscillator has OFF, SAW and PULSE options.</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="70" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="140.0" y="1111">WAVE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="225" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="295.0" y="1111">PW</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="380" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="450.0" y="1111">SUB1</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="535" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="605.0" y="1111">SUB2</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="690" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="760.0" y="1111">CUT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="845" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="915.0" y="1111">RES</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="1000" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1070.0" y="1111">DRV</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#fa8e80" stroke-width="1.7" width="140" x="1155" y="1076" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1225.0" y="1111">BODY</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Source: firmware/src/eng_hades.c, hades_render  ·  inspiration: Dreadbox Hades RE</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
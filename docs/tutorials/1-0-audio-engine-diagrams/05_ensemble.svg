<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="1240" version="1.1" viewBox="0 0 2000 1240" width="2000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="5" markerWidth="5" orient="auto" refX="12" refY="7" viewBox="0 0 14 14"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#edf5ff" /></marker></defs><rect fill="#08111c" height="1240" width="2000" x="0" y="0" /><rect fill="#4fe0c2" height="11" width="2000" x="0" y="0" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="78">CARAVEL  /  FM-1</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="151">ENSEMBLE engine | registers → one filter → moving taps</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="65" y="199">Inspired by vintage string machines such as Solina, not an instrument emulation.</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="227" y2="227" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="69" y="280">VOICE DSP → PER-TRACK ENSEMBLE POST PROCESSING</text><rect fill="#15263a" height="250" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="340" x="68" y="325" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="92" y="374">3 REGISTERS</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="412.0">16′ triangle, low octave</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="440.4">8′ band-limited saw</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="468.8">4′ saw, high octave</text><rect fill="#15263a" height="203" rx="18" ry="18" stroke="#57d7f1" stroke-width="2.4" width="355" x="463" y="348" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="487" y="397">TIMBRE SOURCES</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="487" y="435.0">dark: detuned OSC + ring</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="487" y="463.4">choir: breath noise</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="487" y="491.8">REG sets register blend</text><polyline fill="none" marker-end="url(#arrow)" points="408,451 448,451" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="203" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="390" x="870" y="348" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="894" y="397">ONE SVF</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="894" y="435.0">MORPH: STRINGS →</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="894" y="463.4">CHOIR → DARK</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="894" y="491.8">LP / BP weights + TONE</text><polyline fill="none" marker-end="url(#arrow)" points="818,451 855,451" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="203" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="340" x="1325" y="348" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1349" y="397">VOICE AMP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1349" y="435.0">host envelope</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1349" y="463.4">then voice sum</text><polyline fill="none" marker-end="url(#arrow)" points="1260,451 1310,451" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arrow)" points="1665,452 1720,452 1720,610" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="173" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="639" x="1270" y="621" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1294" y="670">BUILT-IN ENSEMBLE</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1294" y="708.0">3 modulated delay taps per mono side</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1294" y="736.4">6 taps when stereo SPRD is active</text><rect fill="#0c1928" height="246" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="1112" x="68" y="658" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="92" y="701">WHAT MORPH ACTUALLY CHANGES</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="737.0">One filter (not three separate filters) shifts its cutoff,</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="766.7">resonance and LP/BP blend for strings / choir / dark.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="796.4">TEXT sets breath/roughness and nonlinear character.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="92" y="826.1">DRIFT gives slow voice tuning motion.</text><rect fill="#0c1928" height="121" rx="20" ry="20" stroke="#4fe0c2" stroke-width="2" width="1840" x="69" y="939" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="93" y="982">FX POSITION &amp; WIDTH</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="93" y="1018.0">ENSEMBLE post processing happens BEFORE track DIST / INSERT / SLICER / FILTER / sends.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="93" y="1047.7">For stereo, three left taps plus three independent right taps; the send signal uses the mono mid.</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="70" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="140.0" y="1115">REG</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="225" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="295.0" y="1115">MORPH</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="380" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="450.0" y="1115">TONE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="535" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="605.0" y="1115">DRIFT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="690" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="760.0" y="1115">ENS</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="845" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="915.0" y="1115">RATE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="1000" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1070.0" y="1115">TEXT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#4fe0c2" stroke-width="1.7" width="140" x="1155" y="1080" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1225.0" y="1115">MIX</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Source: firmware/src/eng_ensemble.c (ens_render, ens_post) + fx.c (mix_part_inner)</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
<svg baseProfile="full" height="1240" version="1.1" viewBox="0 0 2000 1240" width="2000" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="5" markerWidth="5" orient="auto" refX="12" refY="7" viewBox="0 0 14 14"><path d="M 0 0 L 14 7 L 0 14 Z" fill="#edf5ff" /></marker></defs><rect fill="#08111c" height="1240" width="2000" x="0" y="0" /><rect fill="#57d7f1" height="11" width="2000" x="0" y="0" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="78">CARAVEL  /  FM-1</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="57" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="63" y="151">SEM engine | 2 oscillators + state-variable filter</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="65" y="199">Oberheim SEM: architectural inspiration only, not circuit or sonic emulation.</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="227" y2="227" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="69" y="280">SIGNAL GENERATION &amp; FILTERING</text><rect fill="#15263a" height="146" rx="18" ry="18" stroke="#57d7f1" stroke-width="2.4" width="305" x="80" y="340" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="104" y="389">OSCILLATOR 1</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="427.0">SAW · PULSE · TRI · PWM</text><rect fill="#15263a" height="146" rx="18" ry="18" stroke="#57d7f1" stroke-width="2.4" width="305" x="80" y="546" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="104" y="595">OSCILLATOR 2</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="633.0">SAW · PULSE · TRI · PWM</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="104" y="661.4">DETUNE (DTN)</text><rect fill="#15263a" height="163" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="282" x="485" y="431" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="509" y="480">OSC MIX</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="509" y="518.0">MIX sets blend</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="509" y="546.4">VINT adds pitch drift</text><polyline fill="none" marker-end="url(#arrow)" points="385,414 432,414 432,492 473,492" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><polyline fill="none" marker-end="url(#arrow)" points="385,617 432,617 432,517 473,517" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="186" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="470" x="834" y="420" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="858" y="469">TPT FILTER (2-POLE)</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="858" y="507.0">TYPE: STATE / BP / HP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="858" y="535.4">STATE: LP → NOTCH → HP</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="858" y="563.8">CUT · RES · STATE</text><polyline fill="none" marker-end="url(#arrow)" points="767,514 823,514" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="142" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="375" x="1370" y="440" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1394" y="489">VOICE AMPLITUDE</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1394" y="527.0">host ADSR / velocity</text><polyline fill="none" marker-end="url(#arrow)" points="1304,514 1359,514" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#0c1928" height="275" rx="20" ry="20" stroke="#57d7f1" stroke-width="2" width="870" x="72" y="746" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="96" y="789">THE MUSICAL IDEA</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="825.0">Two band-limited oscillators create the tone.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="854.7">The two-pole filter provides the familiar SEM sweep.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="96" y="884.4">VINT introduces small per-voice tuning variation.</text><rect fill="#0c1928" height="275" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="935" x="973" y="746" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="997" y="789">WHAT THE DIAGRAM MUST NOT IMPLY</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="997" y="825.0">The filter is not limited to its STATE morph mode.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="997" y="854.7">BP and fixed HP are separate TYPE selections.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="997" y="884.4">This is original digital DSP, not Oberheim circuitry.</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="70" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="140.0" y="1108">OSC1</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="225" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="295.0" y="1108">OSC2</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="380" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="450.0" y="1108">DTN</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="535" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="605.0" y="1108">MIX</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="690" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="760.0" y="1108">CUT</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="845" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="915.0" y="1108">RES</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="1000" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1070.0" y="1108">STATE</text><rect fill="#15263a" height="52" rx="16" ry="16" stroke="#57d7f1" stroke-width="1.7" width="140" x="1155" y="1073" /><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-style="normal" font-weight="600" opacity="1" text-anchor="middle" x="1225.0" y="1108">VINT</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Source: firmware/src/eng_sem.c, sem_osc / sem_render  ·  inspiration: Oberheim SEM</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
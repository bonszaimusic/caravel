ker-end="url(#arrow)" points="1194,767 1309,767" stroke="#57d7f1" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#arrow)" points="745,835 781,835 781,854 824,854" stroke="#85b5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><rect fill="#15263a" height="74" rx="18" ry="18" stroke="#85b5ff" stroke-width="2.4" width="370" x="824" y="819" /><text fill="#85b5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="848" y="868">DELAY  (DLY)</text><polyline fill="none" marker-end="url(#arrow)" points="1194,854 1309,854" stroke="#85b5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><polyline fill="none" marker-end="url(#arrow)" points="745,835 781,835 781,941 824,941" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><rect fill="#15263a" height="74" rx="18" ry="18" stroke="#ba9aff" stroke-width="2.4" width="370" x="824" y="906" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="848" y="955">REVERB  (REV)</text><polyline fill="none" marker-end="url(#arrow)" points="1194,941 1309,941" stroke="#ba9aff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" /><rect fill="#15263a" height="250" rx="18" ry="18" stroke="#4fe0c2" stroke-width="2.4" width="287" x="1310" y="743" /><text fill="#4fe0c2" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1334" y="792">SHARED FX</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1334" y="830.0">wet returns</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1334" y="858.4">mixed together</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1334" y="886.8">(mono + Hall side)</text><polyline fill="none" marker-end="url(#arrow)" points="1597,834 1642,834 1642,705" stroke="#4fe0c2" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="108" rx="18" ry="18" stroke="#57d7f1" stroke-width="2.4" width="237" x="1437" y="548" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1461" y="597">DRY L/R</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1461" y="635.0">sum of tracks</text><polyline fill="none" marker-end="url(#arrow)" points="1674,602 1721,602 1721,705" stroke="#57d7f1" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="116" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="292" x="1647" y="706" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1671" y="755">SUM  DRY + WET</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1671" y="793.0">shared master bus</text><polyline fill="none" marker-end="url(#arrow)" points="1793,822 1793,861" stroke="#edf5ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" /><rect fill="#15263a" height="132" rx="18" ry="18" stroke="#f7b951" stroke-width="2.4" width="292" x="1647" y="861" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1671" y="910">MASTER OUT</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1671" y="948.0">gain → performance FX</text><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1671" y="976.4">→ output stages</text><rect fill="#0c1928" height="125" rx="20" ry="20" stroke="#ba9aff" stroke-width="2" width="584" x="62" y="1013" /><text fill="#ba9aff" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="86" y="1056">INSERT IS SERIAL</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="86" y="1092.0">Track signal is processed in-line.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="86" y="1121.7">INSERT itself blends dry and wet.</text><rect fill="#0c1928" height="125" rx="20" ry="20" stroke="#57d7f1" stroke-width="2" width="580" x="673" y="1013" /><text fill="#57d7f1" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="697" y="1056">SENDS ARE PARALLEL</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="697" y="1092.0">CHO / DLY / REV are shared buses.</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="697" y="1121.7">They take post-level mono audio.</text><rect fill="#0c1928" height="125" rx="20" ry="20" stroke="#f7b951" stroke-width="2" width="658" x="1280" y="1013" /><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-style="normal" font-weight="700" opacity="1" text-anchor="start" x="1304" y="1056">IMPORTANT STASIS EXCEPTION</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1304" y="1092.0">STASIS is a REV type. When selected,</text><text fill="#edf5ff" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="1304" y="1121.7">normal DLY is unavailable (shared buffer).</text><line stroke="#30465b" stroke-width="2" x1="60" x2="1940" y1="1150" y2="1150" /><text fill="#a9bac9" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-style="normal" font-weight="400" opacity="1" text-anchor="start" x="63" y="1184">Master stages: DC block → optional speaker EQ → peak limiter → soft clip → USB/DAC; metronome click = DAC only.</text><text fill="#f7b951" font-family="DejaVu Sans, Arial, sans-serif" font-size="16" font-style="normal" font-weight="400" opacity="1" text-anchor="end" x="1935" y="1216">PRIVATE 1.0 DSP BRANCH  ·  ceef206  ·  CODE-REVIEWED DIAGRAM</text></svg>
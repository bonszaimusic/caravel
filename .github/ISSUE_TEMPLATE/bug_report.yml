name: Bug report
description: Something in Caravel doesn't work as it should (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Issues are for reproducible bugs only. Caravel is a separate fork of Felucca 1.6.1: please do not report its problems to Hügelton Instruments or M-VAVE.
  - type: input
    id: version
    attributes:
      label: Caravel version
      description: Hold HOME > ABOUT on the FM-1
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install Pillow fonttools
      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Download the JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
      - name: Build firmware and run the host tests
        env:
          CC: cc -include stdint.h
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
          python3 experiments/dualcore-d1/check_layout.py
          python3 tools/check_050.py
          sh tests/run_tests.sh
      - name: Build versioned Caravel 0.5.0 private test package
        env:
          CC: cc -include stdint.h
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh --binary-version 0.5.0
          python3 web/make_site.py build/caravel-0.5.0.fwsc 0.5.0 build/preview-site --preview
      - name: Upload private Chrome browser preview
        uses: actions/upload-artifact@v4
        with:
          name: caravel-0.5.0-browser-preview-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build/preview-site/
      - name: Upload private 0.5.0 firmware package
        uses: actions/upload-artifact@v4
        with:
          name: caravel-0.5.0-fwsc-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build/caravel-0.5.0.fwsc
      - name: Upload the installable package and licences
        uses: actions/upload-artifact@v4
        with:
          name: caravel-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/caravel.fwsc
            build/felucca.bin
            build/loader/ota.bin
            LICENSE
            LICENSING.md
            LICENSES/
            assets/samples-cc0/ATTRIBUTION.txt
      - name: Install Emscripten (pinned, as the Pages workflow)
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - name: Build the browser emulator (unverified preview of this commit)
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          sh web/emu/build.sh
      - name: Upload the emulator (download, unzip, serve with a local web server; not hosted anywhere)
        uses: actions/upload-artifact@v4
        with:
          name: caravel-emulator-unverified-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: build/emu

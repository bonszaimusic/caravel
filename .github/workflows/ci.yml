# SPDX-License-Identifier: GPL-3.0-only
name: Source and release metadata
on:
  push:
    branches: [main, release/0.13.0]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check publication media and report gate
        run: |
          python3 tools/validate_report_060.py --self-test
      - name: Check release website and workflow behavior
        run: |
          python3 tests/site_release_test.py
          # Classic is transported byte-for-byte, not regenerated from 1.x guides.
          python3 tests/frozen_classic_test.py
          python3 tests/default_routes_test.py
          python3 tests/dual_site_test.py
          node web/generation_storage_test.mjs
          python3 tests/v1_docs_test.py
          python3 tests/academy_overlay_test.py
          python3 tests/tutorial_pages_test.py
          python3 web/tutorial_pages.py --check-readme

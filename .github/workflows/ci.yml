# SPDX-License-Identifier: GPL-3.0-only
name: Source and release metadata
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check publication media and report gate
        run: |
          python3 web/stasis_pages.py --check-source
          python3 tools/validate_report_060.py --self-test

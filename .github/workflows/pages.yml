# Deployment is separately authorized. Build only from the selected published
# release tag, with its verified package/source/notices; never relabel main.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/performance/**'
      - 'web/performance_pages.py'
      - 'tests/performance_site_test.py'
      - '.github/workflows/pages.yml'
  release:
    types: [published]
  # Releases made with GITHUB_TOKEN do not trigger the release event.
  workflow_run:
    workflows: ['Caravel 0.7.0 release']
    types: [completed]
    branches: [release/0.7.0]
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing verified release version, without v (e.g. 0.1.0)'
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    if: github.repository == 'bonszaimusic/caravel' && github.event.repository.private == false && (github.event_name != 'release' || !github.event.release.prerelease) && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Select and validate the exact release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
          TAG: ${{ github.event.release.tag_name || (github.event_name == 'workflow_run' && 'v0.7.0') || '' }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          version = os.environ.get("INPUT_VERSION") or os.environ.get("TAG", "").removeprefix("v")
          if not version:
              version = subprocess.run(
                  ["gh", "release", "view", "--repo", os.environ["GH_REPO"],
                   "--json", "tagName", "--jq", ".tagName"],
                  check=True, capture_output=True, text=True).stdout.strip().removeprefix("v")
          if not re.fullmatch(r"[0-9]\.[0-9](?:\.[0-9]){0,2}(?:-[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*)?", version):
              raise SystemExit("Invalid release version")
          tag = "v" + version
          result = subprocess.run(
              ["gh", "release", "view", tag, "--repo", os.environ["GH_REPO"],
               "--json", "tagName,isDraft,isPrerelease,publishedAt"],
              check=True, capture_output=True, text=True)
          metadata = json.loads(result.stdout)
          if (metadata.get("tagName") != tag or metadata.get("isDraft") is not False
                  or metadata.get("isPrerelease") is not False or not metadata.get("publishedAt")):
              raise SystemExit("Selected release must match the exact tag and be published, non-draft and non-prerelease")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("tag=v" + version, file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VER=" + version, file=output)
              print("RELEASE_TAG=v" + version, file=output)
              print("EMU_VERSION=v" + version.lower(), file=output)
          PY
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Download the complete selected release inventory
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Extra standalone emulators/test ZIPs are separate release downloads,
          # not members of the strict, flat firmware SHA256SUMS inventory.
          python3 - <<'PY'
          import os, pathlib, re, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release'
          root.mkdir()
          command = ['gh', 'release', 'download', os.environ['RELEASE_TAG'],
                     '--repo', os.environ['GH_REPO'], '--dir', str(root)]
          subprocess.run(command + ['--pattern', 'SHA256SUMS'], check=True)
          names = []
          for line in (root / 'SHA256SUMS').read_bytes().splitlines(keepends=True):
              match = re.fullmatch(rb'[0-9a-f]{64}  ([A-Za-z0-9][A-Za-z0-9._-]*)\n', line)
              if not match:
                  raise SystemExit('Invalid or unsafe release manifest entry')
              name = match[1].decode('ascii')
              if name == 'SHA256SUMS' or name in names:
                  raise SystemExit('Duplicate or self-referencing release manifest entry')
              names.append(name)
          if not names:
              raise SystemExit('Empty release manifest')
          subprocess.run(command + [arg for name in names for arg in ('--pattern', name)], check=True)
          PY
      - name: Verify checksums, source identity, notices and binary record
        run: |
          python3 web/make_site.py "$RUNNER_TEMP/release/caravel-$VER.fwsc" "$VER" site \
            --release-dir "$RUNNER_TEMP/release" --check-only
      - name: Install header-generation dependencies
        run: python -m pip install Pillow fonttools
      - name: Match the selected engine and effects profile
        run: |
          if [ "$VER" = 0.6.0 ] || [ "$VER" = 0.7.0 ]; then
            echo 'CARAVEL_REVERB_MINIMAL=1' >> "$GITHUB_ENV"
            echo 'FELUCCA_SLICE=0' >> "$GITHUB_ENV"
            echo 'EMU_CFLAGS=-DCARAVEL_REVERB_MINIMAL=1 -DFELUCCA_SLICE=0' >> "$GITHUB_ENV"
          fi
          if [ "$VER" = 0.6.0 ]; then python3 web/stasis_pages.py --check-source; fi
          if [ "$VER" = 0.7.0 ]; then
            echo 'EMU_CFLAGS=-DCARAVEL_ACTION_BANKS=1 -DFELUCCA_RANDOM_MORPH=1 -DCARAVEL_REVERB_MINIMAL=1 -DCARAVEL_STASIS_EXPAND=1 -DFELUCCA_SLICE=0' >> "$GITHUB_ENV"
          fi
      - name: Generate headers from the selected source (no target binary rebuild)
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "tools")
          import build
          build.generate()
          diagnostics = build.mmio_check()
          for diagnostic in diagnostics:
              print(diagnostic, file=sys.stderr)
          if diagnostics:
              raise SystemExit("MMIO checks failed")
          PY
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - name: Build the selected-source emulator and verified site
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          EMU_PREVIEW=0 sh web/emu/build.sh
          python3 web/make_site.py "$RUNNER_TEMP/release/caravel-$VER.fwsc" "$VER" site \
            --release-dir "$RUNNER_TEMP/release" --emulator build/emu
          if [ "$VER" = 0.6.0 ]; then python3 web/stasis_pages.py --check-site site; fi
      - name: Read current performance website content
        if: env.VER == '0.6.0' || env.VER == '0.7.0'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          path: build/site-content
          persist-credentials: false
      - name: Add performance downloads without changing release artifacts
        if: env.VER == '0.6.0' || env.VER == '0.7.0'
        run: |
          python3 build/site-content/tests/performance_site_test.py
          python3 build/site-content/web/performance_pages.py --site site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

#
# Push a tag vX.Y.Z (one digit each, optionally -suffix, as ./build.sh --release takes it) to build, test and attach the
# release files to a DRAFT release. Nothing is published until you publish the draft on GitHub.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    # 0.7.0 and its RCs belong to the profile-specific release workflows.
    if: github.repository == 'bonszaimusic/caravel' && github.ref_name != 'v0.7.1' && github.ref_name != 'v0.7.0' && !startsWith(github.ref_name, 'v0.7.0-rc')
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Version from the tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "release version: $VER"
      - name: Install Python dependencies
        run: python -m pip install Pillow fonttools
      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Download and verify the pinned JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
          git --no-pager -C "$RUNNER_TEMP/ac79-sdk" rev-parse HEAD | grep -Fx 'd179b4484759423312073f5fbb232501aa491047'
      - name: Release artifact helper tests (isolated synthetic fixtures)
        run: python tests/release_artifacts_test.py
      - name: Build and test
        env:
          CC: cc -include stdint.h
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
          python3 experiments/dualcore-d1/check_layout.py
          python3 tools/check_050.py
          sh tests/run_tests.sh
      - name: Release build
        shell: bash
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh --release "$VER"
          ls -l "build/release-$VER"
      - name: Verify actual release artifacts after the release build
        env:
          AC79_SDK: ${{ runner.temp }}/ac79-sdk
        run: python tools/release_artifacts.py "$VER" --verify-only
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Caravel $VER. What changed: [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          Installing custom firmware is at your own risk: no warranty, and a failed update can need a Transporter to recover
          the FM-1. Attempting to reinstall official firmware does not guarantee factory state, data, warranty or recovery. Caravel is not affiliated with or endorsed by Hügelton Instruments or M-VAVE.

          - \`caravel-$VER.fwsc\`: the installable package (app and loader)
          - \`caravel-$VER-app.bin\`: the firmware app alone
          - \`caravel-$VER-loader.bin\`: the update loader (also contained in the package)
          - \`caravel-$VER-source.tar.gz\`: the complete source including the Felucca-Engines submodule (GitHub's own source archives leave it empty)
          - \`SHA256SUMS\`, \`release-build.json\`, \`ATTRIBUTION.txt\`, \`LICENSE\`, \`LICENSING.md\`, \`NOTICE\`, \`CREDITS.md\`, and the root-level licence \`*.txt\` files: checksums and notices/licence texts (SDK commit and byte identity are checked, not legal clearance)
          NOTES
          PRE=""; case "$VER" in *-*) PRE="--prerelease";; esac
          # The verified directory is flat: GitHub attachment names match SHA256SUMS exactly.
          gh release create "$GITHUB_REF_NAME" --draft $PRE --title "Caravel $VER" --notes-file "$RUNNER_TEMP/notes.md" \
            "build/release-$VER"/*

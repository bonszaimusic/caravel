# SPDX-License-Identifier: GPL-3.0-only
name: ACTION banks 0.6.0 Android emulator

on:
  pull_request:
    paths:
      - 'experiments/action-banks/**'
      - 'experiments/home-perf/**'
      - 'firmware/src/**'
      - 'web/emu/**'
      - 'tests/stasis_continuity_test.c'
      - '.github/workflows/action-banks-android.yml'
      - '.github/workflows/release-071.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: action-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: python -m pip install Pillow fonttools
      - name: Install JieLi toolchain
        run: sh tools/get_toolchain.sh "$RUNNER_TEMP/jieli"
      - name: Fetch and hash-verify pinned JieLi AC79 SDK files
        shell: bash
        run: |
          # Only three SDK binaries are used by our package builder. Gitee
          # full-repository git clones can stall indefinitely: first try raw
          # downloads; independently verify exact versioned SHA-256 hashes.
          set -eu
          root="$RUNNER_TEMP/ac79-sdk/cpu/wl82/tools"
          base="https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK/raw/AC79NN_SDK_V1.2.1_2023-12-13/cpu/wl82/tools"
          mkdir -p "$root/cfg"
          ok=1
          for f in uboot.boot cfg_tool.bin cfg/eq_cfg_hw.bin; do
            curl -fLsS --connect-timeout 8 --max-time 25 --retry 2 --retry-delay 2 \
              -o "$root/$f" "$base/$f" || ok=0
          done
          if [ "$ok" -eq 1 ] && python3 - <<'PY'
          import hashlib, pathlib, os
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"ac79-sdk/cpu/wl82/tools"
          expected={
              "uboot.boot":"4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4",
              "cfg_tool.bin":"276579954f076886a6a7694f65dc71c034a63a2c204b76749065c0ac7b010d1b",
              "cfg/eq_cfg_hw.bin":"41167491bffed4651750719c973d2758adeb9021a5670d02d6a53c85ed80ea7d",
          }
          assert all((root/name).exists() and hashlib.sha256((root/name).read_bytes()).hexdigest()==sha
                     for name,sha in expected.items()), "SDK raw downloads did not match locked hashes"
          print("SDK binaries match pinned SHA-256 fingerprints")
          PY
          then
            echo "Using verified pinned SDK binaries"
          else
            echo "Raw SDK unavailable/mismatched; retrying bounded full-repo clone"
            rm -rf "$RUNNER_TEMP/ac79-sdk"
            timeout 240 git -c http.lowSpeedLimit=1 -c http.lowSpeedTime=30 clone \
              --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
              https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$RUNNER_TEMP/ac79-sdk"
          fi
      - name: Baseline Caravel 0.6.0 build and generated firmware tables
        env:
          CC: cc -include stdint.h
        run: |
          export JIELI_TOOLCHAIN="$RUNNER_TEMP/jieli/toolchain"
          export AC79_SDK="$RUNNER_TEMP/ac79-sdk"
          sh build.sh
      - name: Install pinned WebAssembly toolchain
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install 3.1.64
          "$RUNNER_TEMP/emsdk/emsdk" activate 3.1.64
      - name: Stereo PCM continuity over 36 STASIS grain/window/reverse/scan combinations
        run: |
          cc -O2 -w -ffp-contract=off -Ibuild/gen -Ifirmware/src \
            -DCARAVEL_REVERB_MINIMAL=1 -DCARAVEL_STASIS_EXPAND=1 -DFELUCCA_SLICE=0 \
            tests/stasis_continuity_test.c -o build/stasis-continuity -lm
          build/stasis-continuity
      - name: Combined STASIS layout and lossless compact snapshot references
        run: |
          cc -O2 -w -ffp-contract=off -Ibuild/gen -Ifirmware/src \
            -DCARAVEL_ACTION_BANKS=1 -DFELUCCA_RANDOM_MORPH=1 -DCARAVEL_REVERB_MINIMAL=1 \
            -DCARAVEL_STASIS_EXPAND=1 -DFELUCCA_SLICE=0 -DFELUCCA_PERF_HW=1 \
            experiments/action-banks/stasis_layout_test.c -o build/stasis-layout -lm
          build/stasis-layout
      - name: Persistent snapshots and interrupted migration in the actual target profile
        run: |
          cc -O2 -w -ffp-contract=off -Ibuild/gen -Ifirmware/src \
            -DCARAVEL_ACTION_BANKS=1 -DFELUCCA_RANDOM_MORPH=1 -DCARAVEL_REVERB_MINIMAL=1 \
            -DCARAVEL_STASIS_EXPAND=1 -DFELUCCA_SLICE=0 -DFELUCCA_PERF_HW=1 \
            experiments/home-perf/snapshot_persistence_test.c -o build/snapshot-persistence -lm
          build/snapshot-persistence
      - name: Build 0.6.0 STASIS + HOME/PAIR + ACTION C/WASM Android emulator
        env:
          ACTION_EMU_CFLAGS: '-DCARAVEL_ACTION_BANKS=1 -DFELUCCA_RANDOM_MORPH=1 -DCARAVEL_REVERB_MINIMAL=1 -DCARAVEL_STASIS_EXPAND=1 -DFELUCCA_SLICE=0'
          ACTION_EMU_VERSION: 'v0.6.0-STASIS-SMOOTH-PREFILL'
        run: |
          . "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          python3 experiments/home-perf/build.py
      - name: Real keyboard + LCD + Random Morph WASM integration tests
        run: node experiments/action-banks/action_wasm_test.mjs
      - name: Physical BANK long-press and shared ACTION SETUP firmware tests
        run: node experiments/action-banks/action_setup_wasm_test.mjs
      - name: Four project-persistent snapshots via real A3/A4 keyboard hold and C/WASM morph
        run: node experiments/action-banks/action_snapshots_wasm_test.mjs
      - name: Expanded STASIS C/WASM dual-bank grain and long recording tests
        run: node experiments/action-banks/stasis_granular_wasm_test.mjs
      - name: Random LEVEL/cutoff/manual-priority and native STASIS GRAIN firmware regressions
        run: node experiments/action-banks/morph_safety_wasm_test.mjs
      - name: Anti-crackle audio, zero-slope grains and LONG/DRONE spectral regression
        run: node experiments/action-banks/stasis_antialias_audio_wasm_test.mjs
      - name: Validate offline Android audio worklet / fallback JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('build/home-perf/Caravel-ACTION-BANKS-0.6.0-Android.html')
          s=p.read_text()
          assert 'const STASIS_WORKLET_SOURCE =' in s
          assert 'node = await createStasisAudioNode(ac)' in s
          assert 'Fallback: Audiothread geteilt' in s
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          assert len(scripts)>=1
          Path('build/home-perf/verify-standalone.js').write_text(scripts[-1])
          PY
          node --check build/home-perf/verify-standalone.js
      - name: HOME storage and audio regression against the ACTION profile
        run: node experiments/home-perf/home_wasm_test.mjs
      - name: Check standalone HTML and license bundle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          p=Path('build/home-perf/Caravel-ACTION-BANKS-0.6.0-Android.html')
          s=p.read_text()
          assert p.stat().st_size > 250000
          assert 'ACTION ON/OFF' in s and '0.6.0' in s
          assert 'Uint8Array.from(atob(' in s
          assert 'fetch("felucca.wasm")' not in s
          with ZipFile('build/Caravel-ACTION-060-Android.zip','w',ZIP_DEFLATED) as z:
            z.write(p,p.name)
            for name in ['LICENSE','LICENSING.md','NOTICE','CREDITS.md']:
              z.write(name,name)
            for license in Path('LICENSES').glob('*'):
              if license.is_file():z.write(license,str(license))
          print('Android standalone:',p.stat().st_size,'bytes')
          PY
      - name: Upload full physical FM-1 Android emulator preview
        uses: actions/upload-artifact@v4
        with:
          name: Caravel-060-ACTION-Emulator-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/home-perf/Caravel-ACTION-BANKS-0.6.0-Android.html
            build/Caravel-ACTION-060-Android.zip
